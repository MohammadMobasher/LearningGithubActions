name: test workflow

on:
  push: 
    branches:
      - main

jobs:
  test-action:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: 
        shards: ['1']
    steps:
      - name: Fetch Repo
        uses: actions/checkout@v7

      - name: Test
        run: dotnet test ./LearningGithubActions.slnx --filter Shard=${{ matrix.shards }}  -c Release -l trx --results-directory 'artifacts/tests/output'

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: ${{ success() || failure() }}
        with:
          name: test-results
          path: artifacts/tests/output/**
  
    
