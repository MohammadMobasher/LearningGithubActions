name: test workflow

on:
  push: 
    branches:
      - main

jobs:
  test-action:
    runs-on: ubuntu-latest
    permissions: write-all
    strategy:
      fail-fast: false
      matrix: 
        shards: ['1']
    steps:
      - name: Fetch Repo
        uses: actions/checkout@v7

      - name: Test
        run: dotnet test ./LearningGithubActions.slnx --filter Shard=${{ matrix.shards }}  -c Release -l trx --results-directory 'artifacts/tests/output'

      - name: Set UUID
        if: ${{ success() || failure() }}
        id: generate-uuid
        uses: filipstefansson/uuid-action@v1

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: ${{ success() || failure() }}
        with:
          name: test-results-${{ steps.generate-uuid.outputs.uuid }}
          path: artifacts/tests/output/**

  publish-test-results:
    if: always()
    needs: test-action
    permissions: write-all
    runs-on: ubuntu-latest

    steps:
      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/tests/output

      - name: List downloaded files
        run: |
          find artifacts

     
  
    
