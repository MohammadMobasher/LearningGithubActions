name: Build with Docker

on:
  push: 
    branches:
      - main

jobs:
  build-action:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Repo
        uses: actions/checkout@v7
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
    
      - name: Publish
        run: dotnet publish ./LearningGithubActions.slnx -c Release -o publish
      
      - name: Upload publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-publish
          path: publish/
        
      - name: Build Docker image
        run: docker build -t learninggithubactions:latest .
    
